{% assign p = include.post %}
<a class="card{% if include.big %} card-big{% endif %}" href="{{ p.url | relative_url }}">
  <div class="card-img{% unless p.image %} card-img-empty{% endunless %}">
    {% if p.image %}<img src="{{ p.image | replace: '.webp', '-sm.webp' | relative_url }}" alt="" loading="{% if include.big %}eager{% else %}lazy{% endif %}" width="720" height="460">{% else %}<i class="ph {{ site.data.cats[p.category].icon }}"></i>{% endif %}
  </div>
  <div class="card-t">
    <span class="chip chip-sm">{{ site.data.cats[p.category].name }}</span>
    <h3>{{ p.title }}</h3>
    {% if include.big %}<p>{{ p.summary }}</p>{% endif %}
    <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: '%Y.%m.%d' }}</time>
  </div>
</a>
